name: Video pipeline

on:
  schedule:
    # 15:00 UTC daily. Adjust to taste — this is the only knob that
    # controls posting cadence.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  make-and-publish-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: npm ci

      - name: Generate and upload short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node video-pipeline/run.mjs

      - name: Commit updated state
        run: |
          git config user.name "video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video-pipeline/state.json
          git diff --cached --quiet || git commit -m "chore: video pipeline state update"
          git push
