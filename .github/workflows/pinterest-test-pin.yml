name: Pinterest test pin

# Manual one-off: publishes an existing article as a video Pin, to test the
# integration and record the demo video Pinterest requires for Standard access.
on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: "Article slug to pin (its video is rendered first)"
        required: true
        default: top-robots-aspirateurs-laveurs-2026

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: npm ci

      - name: Render video and create Pin
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE || 'https://api-sandbox.pinterest.com/v5' }}
        run: node video-pipeline/pinterest-test-pin.mjs "${{ inputs.article_slug }}"
